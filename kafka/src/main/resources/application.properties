
# ---------------------------
# Spring App
# ---------------------------
spring.application.name=kafka-mongodb

server.address=0.0.0.0
server.port=9095
server.servlet.context-path=/api

# ---------------------------
# MongoDB
# ---------------------------
spring.data.mongodb.database=vegobject
spring.data.mongodb.uri=mongodb://admin:secret@localhost:27017/vegobject?authSource=admin

# Custom collection name
kafka.collection.name=kafkaMsg

# Build the indexes declared on the entities at startup, so the 2dsphere index
# $geoNear needs exists on a fresh database.
spring.data.mongodb.auto-index-creation=true

# ---------------------------
# Spring MVC / JPA (optional)
# ---------------------------
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
spring.jpa.hibernate.ddl-auto=update

# ---------------------------
# Kafka - Common
# ---------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.topic.name=poledatatopic

# ---------------------------
# Kafka - Producer
# ---------------------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Allow messages up to 10 MB (images can exceed default 1 MB limit)
spring.kafka.producer.properties.max.request.size=10485760

# ---------------------------
# Kafka - Consumer
# ---------------------------
spring.kafka.consumer.group-id=vegobject
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Trust your package (better than *)
spring.kafka.consumer.properties.spring.json.trusted.packages=com.vegData.kafka_mongodb.collection

# Target class for deserialization
spring.kafka.consumer.properties.spring.json.value.default.type=com.vegData.kafka_mongodb.collection.RawDataPole

# (Optional but useful)
spring.kafka.consumer.properties.spring.json.use.type.headers=false
# Match producer max message size
spring.kafka.consumer.properties.max.partition.fetch.bytes=10485760
spring.kafka.consumer.properties.fetch.message.max.bytes=10485760