
# ---------------------------
# Spring App
# ---------------------------
spring.application.name=kafka-mongodb

server.address=0.0.0.0
server.port=9095
server.servlet.context-path=/api

# ---------------------------
# MongoDB
# ---------------------------
spring.data.mongodb.database=vegobject
spring.data.mongodb.uri=mongodb://sree:sree123@dt14.idi.ntnu.no:27017/vegobject?authSource=admin

# Custom collection name
kafka.collection.name=kafkaMsg

# ---------------------------
# Spring MVC / JPA (optional)
# ---------------------------
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
spring.jpa.hibernate.ddl-auto=update

# ---------------------------
# Kafka - Common
# ---------------------------
spring.kafka.bootstrap-servers=dt14.idi.ntnu.no:9092
spring.kafka.topic.name=poles

# ---------------------------
# Kafka - Producer
# ---------------------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ---------------------------
# Kafka - Consumer
# ---------------------------
spring.kafka.consumer.group-id=vegobject-debug
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Trust your package (better than *)
spring.kafka.consumer.properties.spring.json.trusted.packages=com.vegData.kafka_mongodb.collection

# Target class for deserialization
spring.kafka.consumer.properties.spring.json.value.default.type=com.vegData.kafka_mongodb.collection.RawDataPole

# (Optional but useful)
spring.kafka.consumer.properties.spring.json.use.type.headers=false