# Overrides applied when running inside Docker Compose (SPRING_PROFILES_ACTIVE=docker).
# Everything host-specific or secret is read from the environment; the defaults
# match the service names in the root compose.yaml.

# ---------------------------
# MongoDB
# ---------------------------
spring.data.mongodb.uri=${MONGODB_URI:mongodb://admin:secret@mongo:27017/vegobject?authSource=admin}

# ---------------------------
# Kafka
# ---------------------------
spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# ---------------------------
# Application
# ---------------------------
app.frontendUrl=${APP_FRONTEND_URL:http://localhost:8080}
app.jwtSecret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidationPurpose123456789WithMoreCharacters}

# ---------------------------
# Mail
# ---------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
