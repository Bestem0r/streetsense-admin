<div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[9999]">
  <button
    class="absolute inset-0 w-full h-full cursor-default"
    (click)="cancelled.emit()"
    aria-label="Close dialog"
  ></button>
  <div
    class="relative bg-white rounded-xl border border-slate-200 shadow-[0_24px_56px_rgba(15,23,42,.15)] w-[360px] p-6"
    role="dialog"
    aria-modal="true"
  >
    <div class="text-base font-semibold text-slate-900 mb-1.5">{{ title }}</div>
    <div class="text-sm text-slate-500 mb-6">{{ message }}</div>
    <div class="flex justify-end gap-2.5">
      <button
        (click)="cancelled.emit()"
        class="border border-slate-300 text-slate-700 rounded-lg px-4 py-2.5 text-sm font-medium hover:bg-slate-50 cursor-pointer transition-colors"
      >
        Cancel
      </button>
      <button
        (click)="confirmed.emit()"
        class="rounded-lg px-4 py-2.5 text-sm font-medium text-white cursor-pointer transition-colors"
        [class]="danger ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'"
      >
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>
