<div class="p-6 font-sans w-[380px] bg-white">
  <div class="flex items-start justify-between mb-5">
    <div class="text-base font-semibold text-slate-900 leading-tight">
      New Capture Round
    </div>
    <span
      class="bg-blue-600 text-white rounded-full px-3 py-1 text-xs font-semibold shrink-0 ml-3"
    >
      {{ data.poleIds.length }} poles
    </span>
  </div>

  <div class="mb-5">
    <label
      for="date-range"
      class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block mb-2"
    >
      Date Range
    </label>
    <div id="date-range" class="flex items-center gap-2">
      <input
        type="date"
        [(ngModel)]="startDate"
        class="flex-1 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-700 focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-100 transition-colors [color-scheme:light]"
      />
      <i class="fa-solid fa-arrow-right" style="color: rgb(100, 116, 139)"></i>
      <input
        type="date"
        [(ngModel)]="endDate"
        class="flex-1 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-700 focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-100 transition-colors [color-scheme:light]"
      />
    </div>
  </div>

  <div class="flex justify-end gap-2.5">
    <button
      (click)="cancel()"
      class="border border-slate-300 text-slate-700 rounded-lg px-4 py-2.5 text-sm font-medium hover:bg-slate-50 cursor-pointer transition-colors"
    >
      Cancel
    </button>
    <button
      (click)="submit()"
      [disabled]="submitting"
      class="bg-blue-600 text-white rounded-lg px-4 py-2.5 text-sm font-medium hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
    >
      {{ submitting ? "Creating..." : "Create Capture" }}
    </button>
  </div>
</div>
