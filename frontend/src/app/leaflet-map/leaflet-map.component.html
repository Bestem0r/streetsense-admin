<div class="map-container">
  <div class="map-frame">
    <div id="mymap"></div>

    <div
      style="
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1000;
        display: flex;
        gap: 6px;
      "
    >
      <button
        (click)="zoomIn()"
        title="Zoom in"
        style="
          width: 32px;
          height: 32px;
          background: #fff;
          border: 1px solid #cbd5e1;
          border-radius: 6px;
          cursor: pointer;
          font-size: 18px;
          font-weight: 300;
          color: #334155;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
          line-height: 1;
        "
      >
        <i class="fa-solid fa-plus" style="line-height: 1"></i>
      </button>
      <button
        (click)="zoomOut()"
        title="Zoom out"
        style="
          width: 32px;
          height: 32px;
          background: #fff;
          border: 1px solid #cbd5e1;
          border-radius: 6px;
          cursor: pointer;
          font-size: 22px;
          font-weight: 300;
          color: #334155;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
          line-height: 1;
        "
      >
        <i class="fa-solid fa-minus" style="line-height: 1"></i>
      </button>
    </div>

    <div
      style="
        position: absolute;
        top: 12px;
        left: 90px;
        z-index: 1000;
        display: flex;
        flex-direction: row;
        gap: 6px;
      "
    >
      <button
        (click)="toggleDrawMode()"
        [ngClass]="drawingActive ? 'active' : ''"
        title="Select area"
        style="
          height: 32px;
          padding: 0 10px;
          border-radius: 6px;
          border: 1px solid #cbd5e1;
          cursor: pointer;
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.02em;
          display: flex;
          align-items: center;
          gap: 5px;
          box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
          transition:
            background 0.15s,
            color 0.15s;
          white-space: nowrap;
        "
        [style.background]="drawingActive ? '#1e40af' : '#fff'"
        [style.color]="drawingActive ? '#fff' : '#334155'"
        [style.borderColor]="drawingActive ? '#1e40af' : '#cbd5e1'"
      >
        <svg
          width="13"
          height="13"
          viewBox="0 0 13 13"
          fill="none"
          style="flex-shrink: 0"
        >
          <rect
            x="1"
            y="1"
            width="11"
            height="11"
            rx="1"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-dasharray="3 2"
            fill="none"
          />
        </svg>
        {{ drawingActive ? "Cancel" : "Select Area" }}
      </button>

      @if (hasSelection) {
        <button
          (click)="clearSelection()"
          title="Clear selection"
          style="
            height: 32px;
            padding: 0 10px;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
          "
        >
          <svg
            width="11"
            height="11"
            viewBox="0 0 11 11"
            fill="none"
            style="flex-shrink: 0"
          >
            <path
              d="M1 1l9 9M10 1L1 10"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          Clear
        </button>
      }

      <!-- Layer picker -->
      <div style="position: relative">
        <button
          (click)="showLayerMenu = !showLayerMenu"
          title="Switch map layer"
          style="
            height: 32px;
            padding: 0 10px;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
          "
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 13 13"
            fill="none"
            style="flex-shrink: 0"
          >
            <rect
              x="1"
              y="1"
              width="11"
              height="5"
              rx="1"
              stroke="currentColor"
              stroke-width="1.3"
              fill="none"
            />
            <rect
              x="1"
              y="8"
              width="11"
              height="4"
              rx="1"
              stroke="currentColor"
              stroke-width="1.3"
              fill="none"
            />
          </svg>
          {{ activeLayer }}
          <svg
            width="9"
            height="9"
            viewBox="0 0 9 9"
            fill="none"
            style="flex-shrink: 0; opacity: 0.5"
          >
            <path
              d="M1 3l3.5 3L8 3"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
            />
          </svg>
        </button>

        @if (showLayerMenu) {
          <div
            style="
              position: absolute;
              top: 36px;
              left: 0;
              background: #fff;
              border: 1px solid #cbd5e1;
              border-radius: 8px;
              box-shadow: 0 4px 16px rgba(0, 0, 0, 0.13);
              overflow: hidden;
              min-width: 140px;
              z-index: 1001;
            "
          >
            @for (name of layerNames; track name) {
              <button
                (click)="setLayer(name)"
                style="
                  display: flex;
                  align-items: center;
                  gap: 8px;
                  width: 100%;
                  padding: 7px 12px;
                  font-size: 11px;
                  font-weight: 500;
                  cursor: pointer;
                  border: none;
                  text-align: left;
                  transition: background 0.1s;
                "
                [style.background]="activeLayer === name ? '#f1f5f9' : '#fff'"
                [style.color]="activeLayer === name ? '#1e40af' : '#334155'"
              >
                @if (activeLayer === name) {
                  <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
                    <circle cx="4.5" cy="4.5" r="3.5" fill="#1e40af" />
                  </svg>
                } @else {
                  <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
                    <circle
                      cx="4.5"
                      cy="4.5"
                      r="3.5"
                      stroke="#cbd5e1"
                      stroke-width="1.2"
                    />
                  </svg>
                }
                {{ name }}
              </button>
            }
          </div>
        }
      </div>
    </div>

    @if (showSelectionActions) {
      <div
        class="absolute pointer-events-auto"
        style="z-index: 1000; transform: translate(-50%, -110%)"
        [style.left.px]="toolbarPos.x"
        [style.top.px]="toolbarPos.y"
      >
        <div
          class="bg-white rounded-xl border border-slate-200 shadow-[0_24px_56px_rgba(15,23,42,.15)] p-3 flex flex-col gap-2 min-w-[200px]"
        >
          <div
            class="text-[11px] font-semibold text-slate-400 tracking-wide pb-1 border-b border-slate-200"
          >
            {{ selectionCount }} pole{{ selectionCount !== 1 ? "s" : "" }}
            selected
          </div>
          <button
            (click)="planNewCapture()"
            class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-3 py-2 text-xs font-semibold cursor-pointer w-full text-left transition-colors"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 14 14"
              fill="none"
              class="shrink-0"
            >
              <rect
                x="1"
                y="2"
                width="12"
                height="11"
                rx="1.5"
                stroke="currentColor"
                stroke-width="1.3"
                fill="none"
              />
              <path
                d="M4 1v2M10 1v2M1 5h12"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              />
              <path
                d="M7 8v3M5.5 9.5h3"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              />
            </svg>
            Plan New Capture
          </button>
          <button
            (click)="assignToInspector()"
            class="flex items-center gap-2 border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-lg px-3 py-2 text-xs font-semibold cursor-pointer w-full text-left transition-colors"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 14 14"
              fill="none"
              class="shrink-0"
            >
              <circle
                cx="7"
                cy="5"
                r="3"
                stroke="currentColor"
                stroke-width="1.3"
                fill="none"
              />
              <path
                d="M1 13c0-3.314 2.686-5 6-5s6 1.686 6 5"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                fill="none"
              />
            </svg>
            {{ assignInspectorLabel }}
          </button>
        </div>
        <div
          class="mx-auto"
          style="
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid white;
            filter: drop-shadow(0 2px 1px rgba(15, 23, 42, 0.08));
          "
        ></div>
      </div>
    }
  </div>
</div>

@if (showAssignDialog) {
  <app-assign-inspector-dialog
    (selected)="onInspectorSelected($event)"
    (cancelled)="showAssignDialog = false"
  ></app-assign-inspector-dialog>
}
