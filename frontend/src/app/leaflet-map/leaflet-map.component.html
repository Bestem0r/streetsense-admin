<div class="map-container">
  <div class="map-frame">
    <div id="mymap"></div>

    <div
      style="
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1000;
        display: flex;
        gap: 6px;
      "
    >
      <button
        (click)="zoomIn()"
        title="Zoom in"
        style="
          width: 32px;
          height: 32px;
          background: #fff;
          border: 1px solid #cbd5e1;
          border-radius: 6px;
          cursor: pointer;
          font-size: 18px;
          font-weight: 300;
          color: #334155;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
          line-height: 1;
        "
      >
        <i class="fa-solid fa-plus" style="line-height: 1"></i>
      </button>
      <button
        (click)="zoomOut()"
        title="Zoom out"
        style="
          width: 32px;
          height: 32px;
          background: #fff;
          border: 1px solid #cbd5e1;
          border-radius: 6px;
          cursor: pointer;
          font-size: 22px;
          font-weight: 300;
          color: #334155;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
          line-height: 1;
        "
      >
        <i class="fa-solid fa-minus" style="line-height: 1"></i>
      </button>
    </div>

    <div
      style="
        position: absolute;
        top: 12px;
        left: 90px;
        z-index: 1000;
        display: flex;
        flex-direction: row;
        gap: 6px;
      "
    >
      <button
        (click)="toggleDrawMode()"
        [ngClass]="drawingActive ? 'active' : ''"
        title="Select area"
        style="
          height: 32px;
          padding: 0 10px;
          border-radius: 6px;
          border: 1px solid #cbd5e1;
          cursor: pointer;
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.02em;
          display: flex;
          align-items: center;
          gap: 5px;
          box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
          transition:
            background 0.15s,
            color 0.15s;
          white-space: nowrap;
        "
        [style.background]="drawingActive ? '#1e40af' : '#fff'"
        [style.color]="drawingActive ? '#fff' : '#334155'"
        [style.borderColor]="drawingActive ? '#1e40af' : '#cbd5e1'"
      >
        <svg
          width="13"
          height="13"
          viewBox="0 0 13 13"
          fill="none"
          style="flex-shrink: 0"
        >
          <rect
            x="1"
            y="1"
            width="11"
            height="11"
            rx="1"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-dasharray="3 2"
            fill="none"
          />
        </svg>
        {{ drawingActive ? "Cancel" : "Select Area" }}
      </button>

      @if (hasSelection) {
        <button
          (click)="clearSelection()"
          title="Clear selection"
          style="
            height: 32px;
            padding: 0 10px;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
          "
        >
          <svg
            width="11"
            height="11"
            viewBox="0 0 11 11"
            fill="none"
            style="flex-shrink: 0"
          >
            <path
              d="M1 1l9 9M10 1L1 10"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          Clear
        </button>
      }

      <!-- Layer picker -->
      <div style="position: relative">
        <button
          (click)="showLayerMenu = !showLayerMenu"
          title="Switch map layer"
          style="
            height: 32px;
            padding: 0 10px;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
          "
        >
          <svg
            width="13"
            height="13"
            viewBox="0 0 13 13"
            fill="none"
            style="flex-shrink: 0"
          >
            <rect
              x="1"
              y="1"
              width="11"
              height="5"
              rx="1"
              stroke="currentColor"
              stroke-width="1.3"
              fill="none"
            />
            <rect
              x="1"
              y="8"
              width="11"
              height="4"
              rx="1"
              stroke="currentColor"
              stroke-width="1.3"
              fill="none"
            />
          </svg>
          {{ activeLayer }}
          <svg
            width="9"
            height="9"
            viewBox="0 0 9 9"
            fill="none"
            style="flex-shrink: 0; opacity: 0.5"
          >
            <path
              d="M1 3l3.5 3L8 3"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
            />
          </svg>
        </button>

        @if (showLayerMenu) {
          <div
            style="
              position: absolute;
              top: 36px;
              left: 0;
              background: #fff;
              border: 1px solid #cbd5e1;
              border-radius: 8px;
              box-shadow: 0 4px 16px rgba(0, 0, 0, 0.13);
              overflow: hidden;
              min-width: 140px;
              z-index: 1001;
            "
          >
            @for (name of layerNames; track name) {
              <button
                (click)="setLayer(name)"
                style="
                  display: flex;
                  align-items: center;
                  gap: 8px;
                  width: 100%;
                  padding: 7px 12px;
                  font-size: 11px;
                  font-weight: 500;
                  cursor: pointer;
                  border: none;
                  text-align: left;
                  transition: background 0.1s;
                "
                [style.background]="activeLayer === name ? '#f1f5f9' : '#fff'"
                [style.color]="activeLayer === name ? '#1e40af' : '#334155'"
              >
                @if (activeLayer === name) {
                  <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
                    <circle cx="4.5" cy="4.5" r="3.5" fill="#1e40af" />
                  </svg>
                } @else {
                  <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
                    <circle
                      cx="4.5"
                      cy="4.5"
                      r="3.5"
                      stroke="#cbd5e1"
                      stroke-width="1.2"
                    />
                  </svg>
                }
                {{ name }}
              </button>
            }
          </div>
        }
      </div>
    </div>
    <!-- Selection action toolbar -->
    @if (showSelectionActions) {
      <div
        style="position:absolute;z-index:1000;transform:translate(-50%,-110%);pointer-events:auto"
        [style.left.px]="toolbarPos.x"
        [style.top.px]="toolbarPos.y"
      >
        <div style="background:#0f172a;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.25);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:200px">
          <div style="font-size:11px;font-weight:600;color:#94a3b8;letter-spacing:0.04em;padding-bottom:4px;border-bottom:1px solid #1e293b">
            {{ selectionCount }} pole{{ selectionCount !== 1 ? 's' : '' }} selected
          </div>
          <button
            (click)="planNewCapture()"
            style="display:flex;align-items:center;gap:8px;background:#1d4ed8;color:#fff;border:none;border-radius:7px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;text-align:left;width:100%"
          >
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0">
              <rect x="1" y="2" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/>
              <path d="M4 1v2M10 1v2M1 5h12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              <path d="M7 8v3M5.5 9.5h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            Plan New Capture
          </button>
          <button
            (click)="assignToInspector()"
            style="display:flex;align-items:center;gap:8px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:7px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;text-align:left;width:100%"
          >
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0">
              <circle cx="7" cy="5" r="3" stroke="currentColor" stroke-width="1.3" fill="none"/>
              <path d="M1 13c0-3.314 2.686-5 6-5s6 1.686 6 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/>
            </svg>
            Assign to Inspector
          </button>
        </div>
        <!-- arrow -->
        <div style="width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid #0f172a;margin:0 auto"></div>
      </div>
    }

  </div>
</div>
